services:
  - type: web
    name: parsing-based-sentence-reordering
    env: python
    plan: free
    buildCommand: |
      pip install -r requirements.txt
      python -m spacy download en_core_web_sm
      python -c "import nltk, pathlib; p=pathlib.Path('.nltk_data'); p.mkdir(parents=True, exist_ok=True); nltk.download('punkt', download_dir=str(p), quiet=True); nltk.download('reuters', download_dir=str(p), quiet=True)"
    startCommand: gunicorn -w 2 -k gthread -t 120 -b 0.0.0.0:$PORT app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: FLASK_SECRET_KEY
        generateValue: true
